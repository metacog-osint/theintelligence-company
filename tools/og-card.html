<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Link preview card</title>
<!-- Source for site/img/og-card.png (1200x630): the picture LinkedIn, Slack, Signal and others show when the hub's
     link is pasted. Uses the site's own fonts and colours ("The Briefing"). Regenerate with the command in CLAUDE.md
     ("Link preview"). Not deployed: only site/ is published. -->
<style>
@font-face { font-family: "Newsreader"; font-weight: 400 600; src: url("../site/fonts/newsreader-latin.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 500; src: url("../site/fonts/ibm-plex-mono-500-latin.woff2") format("woff2"); }
html, body { margin: 0; }
body { width: 1200px; height: 630px; overflow: hidden; background: #F7F5F0; color: #14202E; }
.card { box-sizing: border-box; height: 630px; padding: 60px 80px 58px; display: flex; flex-direction: column; }
.mast { display: flex; align-items: center; gap: 20px; padding-bottom: 26px; border-bottom: 5px double #14202E;
  font: 600 42px/1.1 "Newsreader", Georgia, serif; letter-spacing: -.01em; }
.mast .where { margin-left: auto; font: 500 20px/1.3 "IBM Plex Mono", Consolas, monospace; letter-spacing: .06em;
  text-transform: uppercase; color: #555F6D; }
h1 { flex: 1; margin: 0; display: flex; align-items: center; font: 500 84px/1.04 "Newsreader", Georgia, serif;
  letter-spacing: -.02em; }
.foot { display: flex; justify-content: space-between; align-items: baseline; gap: 24px;
  font: 500 22px/1.3 "IBM Plex Mono", Consolas, monospace; letter-spacing: .06em; text-transform: uppercase; }
.lines { color: #8F5509; }
.where { color: #555F6D; }
</style>
</head>
<body>
<div class="card">
  <div class="mast">
    <svg width="58" height="58" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="13" fill="none" stroke="#E3A83B" stroke-width="3.5"/><circle cx="17" cy="17" r="4.5" fill="#14202E"/></svg>
    The Intelligence Company
    <span class="where">Fargo-Moorhead, ND/MN</span>
  </div>
  <h1>Open-source intelligence, built in the Red&nbsp;River&nbsp;Valley.</h1>
  <div class="foot"><span class="lines">Conflict · GPS · Cyber · Space · Hazards · Forecasting</span></div>
</div>
</body>
</html>
