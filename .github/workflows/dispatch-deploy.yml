name: dispatch-deploy
# Tests and deploys the Cloudflare Worker in dispatch/ (tic-dispatch), which starts Elements' and Cordon's update
# workflows every 30 minutes because GitHub's own schedule fires only every 4 to 9 hours on this account.
# Repo secrets, all set by Tom:
#   DISPATCH_TOKEN         fine-grained GitHub token: repositories elements and cordon only, Actions: read and write
#   CLOUDFLARE_API_TOKEN   Cloudflare API token made from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account ID
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ["dispatch/**", ".github/workflows/dispatch-deploy.yml"]
permissions:
  contents: read
concurrency:
  group: dispatch-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_SECRETS: ${{ secrets.DISPATCH_TOKEN != '' && secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Stop if a secret is missing
        if: env.HAS_SECRETS != 'true'
        run: echo "::error::Set DISPATCH_TOKEN, CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID first (see the top of this file)"; exit 1
      - uses: actions/checkout@v7
      - name: Test
        working-directory: dispatch
        run: node --test
      # Deploy first: the action uploads secrets before deploying, which fails on a first run because the Worker
      # doesn't exist yet (same order as PropertyCast's trigger-deploy).
      - name: Deploy the Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: dispatch
          command: deploy
      - name: Upload the dispatch token and redeploy
        uses: cloudflare/wrangler-action@v4
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: dispatch
          command: deploy
          secrets: |
            DISPATCH_TOKEN
